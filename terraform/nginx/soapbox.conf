# Nginx configuration for Soapbox atop this Mastodon-compatible backend.
#
# Adapted from the official Soapbox/Mastodon nginx config:
# https://gitlab.com/soapbox-pub/soapbox/-/raw/main/installation/mastodon.conf
#
# Key differences from the upstream template:
#   - Single upstream (Spring/WebFlux on port 8080) instead of separate
#     Rails (3000) + Node streaming (4000) upstreams.
#   - The /api/v1/streaming WebSocket path is handled by the same upstream.
#   - No Mastodon public/ directory fallback (no Ruby on Rails install).
#   - Soapbox is built from the redplanetlabs fork and served from /opt/soapbox.
#
# Replace $DOMAIN with your actual domain name (handled by Terraform templatefile).

map_hash_bucket_size 128;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ActivityPub routing: send AP requests directly to the backend.
map $http_accept $activitypub_location {
  default @soapbox;
  "application/activity+json" @mastodon;
  'application/ld+json; profile="https://www.w3.org/ns/activitystreams"' @mastodon;
}

# Single upstream: the Spring/WebFlux Mastodon API (handles both REST and WebSocket streaming).
upstream backend {
  server 127.0.0.1:8080 fail_timeout=0;
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=CACHE:10m inactive=7d max_size=1g;

# HTTP — redirect to HTTPS (or serve directly if SSL is not yet configured).
server {
  listen 80;
  listen [::]:80;
  server_name $DOMAIN $NGINX_CATCHALL;
  root /opt/soapbox;

  # Let's Encrypt ACME challenge passthrough.
  location /.well-known/acme-challenge/ { allow all; }

  # Uncomment the line below once SSL is configured to force HTTPS:
  # location / { return 301 https://$host$request_uri; }

  # ---- Everything below duplicates the HTTPS server block so the site
  #      works over plain HTTP before a certificate is provisioned. ----

  keepalive_timeout    70;
  sendfile             on;
  client_max_body_size 80m;

  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml image/x-icon;

  # Fallback: try static files, then the SPA.
  location / {
    try_files $uri @soapbox;
  }

  # All Mastodon API, OAuth, ActivityPub inbox, and well-known routes go to the backend.
  location ~ ^/(api|inbox|oauth|auth|admin|manifest.webmanifest|nodeinfo|unsubscribe|uploads|\.well-known/(webfinger|host-meta|nodeinfo|change-password)|@(.+)/embed$) {
    try_files /dev/null @mastodon;
  }

  # ActivityPub profile routes — route by Accept header.
  location ~ ^/(users|@(.+)) {
    try_files /dev/null $activitypub_location;
  }

  # Soapbox static assets (hashed filenames — cache aggressively).
  location /packs {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Soapbox instance configuration files (CORS required for fetch).
  location /instance {
    add_header Access-Control-Allow-Origin "*";
    if ($request_method = 'OPTIONS') {
      add_header Access-Control-Allow-Origin "*";
      return 204;
    }
    try_files $uri @soapbox;
  }

  # Soapbox ServiceWorker — never cache.
  location = /sw.js {
    add_header Cache-Control "public, max-age=0";
    try_files $uri =404;
  }

  # Soapbox SPA fallback.
  location @soapbox {
    try_files /index.html =404;
  }

  # Proxy to the Spring/WebFlux backend (REST + WebSocket streaming).
  location @mastodon {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy "";
    proxy_pass_header Server;

    proxy_pass http://backend;
    proxy_buffering on;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_cache CACHE;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 410 24h;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cached $upstream_cache_status;

    tcp_nodelay on;
  }

  error_page 500 501 502 503 504 /500.html;
}

